<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>기계공학 연구 트렌드와 주제 추천</title>
<style>
:root{--bg:#f7f8f6;--fg:#1c2421;--muted:#5d6964;--line:#dde3df;--accent:#1f6f5c;--panel:#fff}
@media (prefers-color-scheme:dark){:root{--bg:#121816;--fg:#e4ebe8;--muted:#94a39d;--line:#2c3633;--accent:#5fc3a6;--panel:#1a2220}}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.7 system-ui,-apple-system,"Apple SD Gothic Neo","Noto Sans KR",sans-serif}
main{max-width:860px;margin:0 auto;padding:32px 16px 80px}
h1{font-size:1.8rem;line-height:1.3}h2{margin-top:2.2em;padding-top:.6em;border-top:1px solid var(--line);font-size:1.35rem}h3{margin-top:1.6em;font-size:1.1rem}
a{color:var(--accent)}hr{border:0;border-top:1px solid var(--line);margin:2em 0}
.tw{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:.92rem;background:var(--panel)}
th,td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}th{color:var(--muted);font-weight:600}
code{background:var(--panel);border:1px solid var(--line);border-radius:4px;padding:1px 5px;font-size:.88em}
li{margin:.25em 0}
</style>
</head>
<body>
<main id="doc">불러오는 중… 표시되지 않으면 <a href="trend.md">trend.md</a>를 직접 여세요.</main>
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js"></script>
<script>
fetch('trend.md').then(r=>r.text()).then(t=>{
  const el=document.getElementById('doc');
  el.innerHTML=marked.parse(t);
  el.querySelectorAll('table').forEach(tb=>{const w=document.createElement('div');w.className='tw';tb.replaceWith(w);w.appendChild(tb);});
});
</script>
</body>
</html>
